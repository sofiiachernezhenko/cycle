<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYCLE</title>
    <link rel="stylesheet" href="design.css">
</head>

<body>
    <nav>
        <img src="cycle_img/website_sprites/qlogo.png" alt="Logo for CYCLE">
        <ul id="menu">
            <li><a href="tur.html">Gruppe tur</a></li>
            <li><a href="medlem.html">Bli medlem</a></li>
            <li><a href="oss.html">Om oss</a></li>
        </ul>
    </nav>
    <div id="blue_box">
        <div id="text_in_box">
            <h1>Meld seg på gruppe tur</h1>

            <label for="Name">Navn:</label>
            <input type="text" id="Name" name="Name" required>

            <label for="Surname">Etternavn:</label>
            <input type="text" id="Surname" name="Surname" required>

            <label for="DOB">Fødselsdato:</label>
            <input type="date" id="DOB" name="DOB" required>

            <label for="Tlf">Telefonnummer:</label>
            <input type="number" id="Tlf" name="Tlf" required>

            <label for="Terms">Jeg godtar at min personlig informasjon skal brukes av CYCLE AS og jeg vil få SMS med
                bekreftelse og detaljer om turen</label>
            <input type="checkbox" id="Terms" name="Terms" required>

            <button onclick="submitForm()">Send inn</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
<footer>
    <div class="footer">
        <div id="logo_description">
            <img src="cycle_img/website_sprites/qlogo.png" alt="logo of CYCLE">
            <p>
                Vi skapet møte sted til alle hvor du kan vare sosialt og kreativt til fordel for naturen.
            </p>
        </div>
        <div id="contact_info">
            <h3>Kontakt oss</h3>
            <p>+47 944 45 947<br>cycle.post@bedrift.no</p>
            <img src="cycle_img/website_sprites/facebooklogo.png" alt="Facebook logo">
            <img src="cycle_img/website_sprites/instlogo.png" alt="Instagram logo">
        </div>
    </div>
</footer>

</html>
