<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYCLE</title>
    <link rel="stylesheet" href="design.css" />
  </head>

  <body>
    <nav>
      <img src="cycle_img/website_sprites/qlogo.png" alt="Logo for CYCLE" />
      <ul class="menu">
        <li><a href="tur.html">Gruppetur</a></li>
        <li><a href="medlem.html">Bli medlem</a></li>
        <li><a href="oss.html">Om oss</a></li>
      </ul>
      <a href="burger_menu.html" id="burger_meny">
        <img
          src="cycle_img/website_sprites/burger_menu.png"
          alt="Button to open menu"
          id="burger_meny"
        />
      </a>
    </nav>
    <div class="green_box">
      <div id="text_in_box">
        <h1>Meld seg på gruppe tur</h1>

        <label for="Name">Navn:</label>
        <input type="text" placeholder="Ola" id="Name" name="Name" required />

        <label for="Surname">Etternavn:</label>
        <input
          type="text"
          placeholder="Olsen"
          id="Surname"
          name="Surname"
          required
        />

        <label for="DOB">Fødselsdato:</label>
        <input type="date" id="DOB" name="DOB" required />

        <label for="Tlf">Telefonnummer:</label>
        <input
          type="tel"
          placeholder="+47 944 45 547"
          id="Tlf"
          name="Tlf"
          required
        />
        <div id="checkbox">
          <input type="checkbox" id="Terms" name="Terms" required />
          <label for="Terms"
            >Jeg godtar at min personlige informasjon skal brukes av CYCLE AS og
            jeg vil få SMS med bekreftelse og detaljer om turen</label
          >
        </div>

        <button onclick="submitForm()">Send inn</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
  <footer>
    <div id="logo_description">
      <img src="cycle_img/website_sprites/qlogo.png" alt="logo of CYCLE" />
      <p>
        Vi skapet møte sted til alle hvor du kan vare sosialt og kreativt til
        fordel for naturen.
      </p>
    </div>
    <div id="contact_info">
      <h3>Kontakt oss</h3>
      <p>+47 944 45 947<br />cycle.post@bedrift.no</p>
      <div id="SoMe_box">
        <a href="#">
          <img
            src="cycle_img/website_sprites/facebooklogo.png"
            alt="Facebook logo"
          />
        </a>
        <a href="#">
          <img
            src="cycle_img/website_sprites/instlogo.png"
            alt="Instagram logo"
          />
        </a>
      </div>
    </div>
  </footer>
</html>
